repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-yaml
- repo: https://github.com/keith/pre-commit-buildifier
  rev: 8.2.1
  hooks:
    - id: buildifier
    - id: buildifier-lint
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.13.0
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
exclude: \.patch$
